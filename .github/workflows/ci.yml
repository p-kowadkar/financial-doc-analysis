name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ libcurl4-openssl-dev libssl-dev pkg-config

    - name: Create directories
      run: |
        mkdir -p output
        mkdir -p data/sec_filings
    
    - name: Build project
      run: |
        cd src
        chmod +x build.sh
        # Add curl flags for sec_data_acquisition compilation
        export CPPFLAGS="$(pkg-config --cflags libcurl)"
        export LDFLAGS="$(pkg-config --libs libcurl)"
        ./build.sh
    
    - name: Run unit tests
      run: |
        cd tests/unit
        # Compile and run document parser test
        g++ -std=c++17 -I.. -I../.. test_document_parser.cpp -o test_document_parser
        ./test_document_parser
        
        # Compile and run TFIDF embedding test
        g++ -std=c++17 -I.. -I../.. test_tfidf_embedding.cpp -o test_tfidf_embedding
        ./test_tfidf_embedding
        
        # Compile and run LLM client test (mock implementation)
        g++ -std=c++17 -I.. -I../.. test_llm_client.cpp -o test_llm_client
        ./test_llm_client
    
    - name: Test core executables
      run: |
        cd src
        echo "Testing document parser..."
        echo "Sample text content" > test_input.txt
        ./document_parser test_input.txt ../output/test_output.json
        
        echo "Testing HTML extractor..."
        echo "<html><body><p>Test</p></body></html>" > test.html
        ./html_text_extractor test.html ../output/test_clean.txt
        
        echo "Testing TF-IDF embedding..."
        ./tfidf_embedding --help

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MinGW and dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-openssl
          make
          mingw-w64-x86_64-pkg-config
    
    - name: Create directories
      shell: msys2 {0}
      run: |
        mkdir -p output
        mkdir -p data/sec_filings
    
    - name: Build project (Windows)
      shell: msys2 {0}
      run: |
        cd src
        # Export pkg-config variables for curl
        export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"
        export CPPFLAGS="$(pkg-config --cflags libcurl)"
        export LDFLAGS="$(pkg-config --libs libcurl)"
        
        # Build core components first
        g++ -std=c++17 -O2 -o document_parser.exe document_parser.cpp
        g++ -std=c++17 -O2 -o html_text_extractor.exe html_text_extractor.cpp
        g++ -std=c++17 -O2 -o tfidf_embedding.exe tfidf_embedding.cpp
        g++ -std=c++17 -O2 -o query_engine.exe query_engine.cpp
        g++ -std=c++17 -O2 -o rag_engine.exe rag_engine.cpp
        g++ -std=c++17 -O2 -o financial_analyzer.exe financial_analyzer.cpp
        g++ -std=c++17 -O2 -o main.exe main.cpp
        
        # Try to build libcurl-dependent components
        echo "Attempting to build libcurl-dependent components..."
        g++ -std=c++17 -O2 $(pkg-config --cflags libcurl) -o sec_data_acquisition.exe sec_data_acquisition.cpp sec_edgar_client.cpp $(pkg-config --libs libcurl) || echo "Warning: Failed to build sec_data_acquisition.exe"
    
    - name: Test Windows build
      shell: msys2 {0}
      run: |
        cd src
        echo "Sample text" > test.txt
        ./document_parser.exe test.txt ../output/test_output.json
        
        echo "<html><body><p>Test content</p></body></html>" > test.html
        ./html_text_extractor.exe test.html ../output/test_clean.txt
        
        ./tfidf_embedding.exe --help

  deploy:
    needs: [test, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ libcurl4-openssl-dev pkg-config
    
    - name: Build release
      run: |
        cd src
        chmod +x build.sh
        # Add curl flags for sec_data_acquisition compilation
        export CPPFLAGS="$(pkg-config --cflags libcurl)"
        export LDFLAGS="$(pkg-config --libs libcurl)"
        ./build.sh
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release from main branch
          
          ## Changes
          - Latest stable build
          - All tests passing
          - Windows and Linux builds verified
          
        draft: false
        prerelease: false
    
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: linux-binaries
        path: src/*
        if-no-files-found: error
